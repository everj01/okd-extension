<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Okumet Document Access</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app app-loading" id="app">

      <!-- ===================== LOGIN VIEW ===================== -->
      <section id="view-login" class="view view-login">
        <div class="login-card">
          <div class="brand">
            <img src="icon.png" alt="Okumet" class="brand-logo" />
            <div class="brand-text">
              <h1>Okumet</h1>
              <span>Document Access</span>
            </div>
          </div>

          <p class="login-subtitle">Inicia sesión para acceder a tus documentos de SINOE</p>

          <form id="login-form" class="login-form">
            <label class="field">
              <span>Correo electrónico</span>
              <input type="email" name="email" placeholder="correo@ejemplo.com" autocomplete="email" required />
            </label>

            <label class="field">
              <span>Contraseña</span>
              <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
            </label>

            <p id="login-error" class="login-error"></p>

            <button type="submit" id="login-submit" class="btn btn-primary">Iniciar sesión</button>
          </form>

          <a href="#" class="login-forgot">¿Olvidaste tu contraseña?</a>
        </div>
      </section>

      <!-- ===================== WORKSPACE VIEW ===================== -->
      <section id="view-workspace" class="view view-workspace hidden">

        <header class="topbar">
          <div class="topbar-brand">
            <img src="icon.png" alt="Okumet" />
          </div>

          <nav class="topbar-tabs" role="tablist">
            <button class="tab-btn active" data-tab="documentos" type="button">Pendientes</button>
            <button class="tab-btn" data-tab="sincronizados" type="button">Sincronizados</button>
          </nav>

          <div class="profile-wrap">
            <button id="profile-btn" class="profile-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Perfil">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z" />
              </svg>
            </button>
            <div id="profile-menu" class="profile-menu hidden">
              <button id="go-panel" class="profile-menu-item" type="button">
                Ir al panel
              </button>
              <button id="logout" class="profile-menu-item profile-menu-item--danger" type="button">
                Cerrar sesión
              </button>
            </div>
          </div>
        </header>

        <!-- Connection status banner (populated by JS based on active tab) -->
        <div id="status-banner" class="status-banner"></div>

        <!-- Tab panels -->
        <div class="tab-panels">
          <div class="tab-panel active" id="panel-documentos">
            <ul class="pending-list" id="pending-list"></ul>
            <p class="empty-state" id="pending-empty">Todavía no hay documentos pendientes.</p>
          </div>

          <div class="tab-panel" id="panel-sincronizados">
            <ul class="pending-list" id="synced-list"></ul>
            <p class="empty-state" id="synced-empty">Todavía no hay nada sincronizado.</p>
          </div>
        </div>
      </section>

      <!-- ===================== MODAL DE VALIDACIÓN DE IDENTIDAD ===================== -->
      <div id="identity-modal" class="identity-modal hidden" role="status" aria-live="polite">
        <div class="identity-modal-card">
          <img src="icon.png" alt="Okumet" class="identity-modal-logo" />
          <div class="spinner spinner-lg"></div>
          <p class="identity-modal-title">Verificando identidad</p>
          <p id="identity-modal-message" class="identity-modal-message">Preparando validación…</p>
        </div>
      </div>

    </div>
    <script src="popup.js"></script>
  </body>
</html>
